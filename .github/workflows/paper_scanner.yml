name: NSE Strategy V1 Paper Scanner

on:
  workflow_dispatch:
  schedule:
    # UTC schedule = approximately 09:32 to 15:47 IST.
    # The Python scanner itself rejects runs outside NSE hours
    # and only evaluates the latest completed 15M candle.
    - cron: "2,17,32,47 4-10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: trading-agent-v1-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run paper scanner
        env:
          UPSTOX_TOKEN: ${{ secrets.UPSTOX_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py

      - name: Save alert state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state/telegram_alert_state.json

          if git diff --cached --quiet; then
            echo "No alert-state changes."
          else
            git commit -m "Update paper alert state"
            git push
          fi
