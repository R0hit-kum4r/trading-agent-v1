
name: NSE Strategy V1 Paper Scanner

on:
  workflow_dispatch:

  schedule:
    # Monday to Friday
    # IST: 09:32 AM to 03:47 PM
    # UTC: 04:02 AM to 10:17 AM
    - cron: "2,17,32,47 4-9 * * 1-5"
    - cron: "17 10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: trading-agent-v1-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-24.04

    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run paper scanner
        env:
          UPSTOX_TOKEN: ${{ secrets.UPSTOX_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py

      - name: Save alert state
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state/telegram_alert_state.json

          if git diff --cached --quiet; then
            echo "No alert-state changes."
          else
            git commit -m "Update paper alert state"
            git push
          fi
